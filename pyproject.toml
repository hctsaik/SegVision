[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "segvision"
version = "0.1.0"
description = "CPU-first ROI interactive annotation core"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<3",
    "jsonschema>=4.18,<5",
    "Pillow>=10,<13",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "playwright>=1.49,<2",
]

[project.scripts]
segvision = "segvision.cli:main"
segvision-gui = "segvision.desktop:main"
segvision-pyside6 = "segvision.gui.app:main"
segvision-desktop-engine = "segvision.transport.desktop_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".ai-staff", ".venv", "evidence", "dist", "build"]

[tool.mypy]
python_version = "3.11"
packages = ["segvision"]
ignore_missing_imports = true
